<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1080" height="1080" viewBox="0 0 1080 1080" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #121212; }
      .neon-green { fill: #00FF44; }
      .cyan { fill: #00CED1; }
      .pink { fill: #FF1493; }
      .card-bg { fill: #1E1E1E; stroke: #00CED1; stroke-width: 2; }
      .text-heading { font-family: 'Uncut Sans', sans-serif; font-weight: bold; fill: #FFFFFF; font-size: 64px; }
      .text-body { font-family: 'Uncut Sans', sans-serif; fill: #CCCCCC; font-size: 32px; }
      .text-code { font-family: 'Monaspace Neon', monospace; fill: #00FF44; font-size: 28px; }
      .text-brand { font-family: 'Monaspace Neon', monospace; fill: #00CED1; font-size: 24px; font-weight: bold; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect class="bg" width="1080" height="1080" x="0" y="0" />

  <!-- Margem / Safe Area (Guias) -->
  <rect x="60" y="60" width="960" height="960" fill="none" stroke="#333333" stroke-width="2" stroke-dasharray="8,8" />

  <!-- Cabeçalho / Branding -->
  <text x="80" y="120" class="text-brand">&gt;_ BASH NA PISTA</text>
  <line x1="80" y1="140" x2="1000" y2="140" stroke="#00FF44" stroke-width="4" />

  <!-- Título do Post -->
  <text x="80" y="240" class="text-heading">TÍTULO DO POST</text>
  <text x="80" y="310" class="text-heading" fill="#00FF44">AQUI EM DESTAQUE</text>

  <!-- Subtítulo / Descrição -->
  <text x="80" y="400" class="text-body">Subtítulo ou explicação curta do conteúdo para</text>
  <text x="80" y="445" class="text-body">engajar no feed ou na aba Comunidade.</text>

  <!-- Bloco de Código / Terminal Snippet (Card) -->
  <rect class="card-bg" x="80" y="520" width="920" height="360" rx="12" ry="12" />
  <!-- Bolinhas de janela de terminal -->
  <circle cx="120" cy="555" r="8" fill="#FF1493" />
  <circle cx="145" cy="555" r="8" fill="#FFD700" />
  <circle cx="170" cy="555" r="8" fill="#00FF44" />
  <!-- Trecho de Código Placeholder -->
  <text x="120" y="620" class="text-code">$ ./script-exemplo.sh --input="/midia"</text>
  <text x="120" y="670" class="text-code">[+] Processando imagens em lote...</text>
  <text x="120" y="720" class="text-code">[✓] Concluído em 1.2s!</text>

  <!-- Rodapé -->
  <text x="80" y="980" class="text-brand" fill="#888888">github.com/criativotech/bash-na-pista</text>
  <text x="1000" y="980" class="text-brand" text-anchor="end" fill="#FF1493">#LinuxDesign</text>
</svg>
