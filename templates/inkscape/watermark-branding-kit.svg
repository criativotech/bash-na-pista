<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #121212; }
      .card { fill: #1E1E1E; stroke: #333333; stroke-width: 2; }
      .text-heading { font-family: 'Uncut Sans', sans-serif; font-weight: bold; fill: #FFFFFF; font-size: 48px; }
      .text-sub { font-family: 'Monaspace Neon', monospace; fill: #00CED1; font-size: 24px; }
      .label { font-family: 'Monaspace Neon', monospace; fill: #888888; font-size: 20px; }
      
      /* Elementos da Marca */
      .brand-prompt { font-family: 'Monaspace Neon', monospace; font-weight: bold; fill: #00FF44; font-size: 56px; }
      .brand-text { font-family: 'Uncut Sans', sans-serif; font-weight: bold; fill: #FFFFFF; font-size: 56px; }
      .brand-cyan { fill: #00CED1; }
    </style>
  </defs>

  <!-- Fundo do Canvas -->
  <rect class="bg" width="1920" height="1080" x="0" y="0" />

  <!-- Título do File/Sheet -->
  <text x="80" y="100" class="text-heading">BASH NA PISTA — WATERMARK &amp; BRANDING KIT</text>
  <text x="80" y="140" class="text-sub">&gt;_ Export e use com o script: ./img-watermark.sh -w &lt;marca.png&gt;</text>
  <line x1="80" y1="170" x2="1840" y2="170" stroke="#00FF44" stroke-width="2" opacity="0.5" />

  <!-- OPÇÃO 01: Marca Completa / Horizontal (Fundo Escuro/Transparente) -->
  <g id="watermark-horizontal-light">
    <rect class="card" x="80" y="220" width="540" height="320" rx="12" ry="12" />
    <text x="110" y="260" class="label">01. Horizontal (Neon / White)</text>
    <g transform="translate(120, 360)">
      <text class="brand-prompt">/&gt;</text>
      <text x="110" y="0" class="brand-text">BASH<tspan class="brand-cyan">PISTA</tspan></text>
    </g>
  </g>

  <!-- OPÇÃO 02: Marca Minimalista (Terminal Badge) -->
  <g id="watermark-badge-cli">
    <rect class="card" x="690" y="220" width="540" height="320" rx="12" ry="12" />
    <text x="720" y="260" class="label">02. Terminal Badge (Minimalista)</text>
    <g transform="translate(850, 330)">
      <rect x="0" y="0" width="220" height="100" rx="16" ry="16" fill="#121212" stroke="#00FF44" stroke-width="4" />
      <text x="40" y="68" class="brand-prompt" font-size="64px">/&gt;</text>
    </g>
  </g>

  <!-- OPÇÃO 03: Marca Compacta / Canto de Imagem -->
  <g id="watermark-compact-tag">
    <rect class="card" x="1300" y="220" width="540" height="320" rx="12" ry="12" />
    <text x="1330" y="260" class="label">03. Tag Vertical Compacta</text>
    <g transform="translate(1420, 340)">
      <text class="brand-prompt" font-size="40px">&gt;_ BASH NA PISTA</text>
      <text x="0" y="45" font-family="'Monaspace Neon', monospace" fill="#888888" font-size="20px">criativotech/bash-na-pista</text>
    </g>
  </g>

  <!-- SEÇÃO DE INSTRUÇÕES DE EXPORTAÇÃO -->
  <g id="export-instructions">
    <rect class="card" x="80" y="580" width="1760" height="420" rx="12" ry="12" />
    <text x="120" y="640" class="text-heading" font-size="36px" fill="#00CED1">💡 Como Exportar do Inkscape para o Script CLI:</text>
    <text x="120" y="710" font-family="'Uncut Sans', sans-serif" fill="#CCCCCC" font-size="28px">1. Abra este arquivo no Inkscape (zypper in inkscape / flatpak).</text>
    <text x="120" y="760" font-family="'Uncut Sans', sans-serif" fill="#CCCCCC" font-size="28px">2. Selecione uma das marcas (Opção 01, 02 ou 03).</text>
    <text x="120" y="810" font-family="'Uncut Sans', sans-serif" fill="#CCCCCC" font-size="28px">3. Exporte a seleção como PNG transparente (Ctrl + Shift + E).</text>
    <text x="120" y="860" font-family="'Uncut Sans', sans-serif" fill="#CCCCCC" font-size="28px">4. Execute no terminal: ./scripts/img-watermark.sh -i ~/Fotos -w ./marca.png</text>
  </g>
</svg>
